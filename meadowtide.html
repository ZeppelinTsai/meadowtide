function buildMap(mapName) {
  scene.remove(mapGroup);
  mapGroup = new THREE.Group();
  windowMats.length = 0;
  outdoorLampLights.length = 0;

  const map = MAPS[mapName];
  const rows = map.tiles.length, cols = map.tiles[0].length;

  let plateauGroup = mapGroup;

  if (mapName === 'house') {
    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(cols * TILE, 0.2, rows * TILE),
      new THREE.MeshStandardMaterial({ color: 0xc9b48a })
    );
    ground.position.set((cols * TILE) / 2 - TILE / 2, -0.1, (rows * TILE) / 2 - TILE / 2);
    ground.receiveShadow = true;
    mapGroup.add(ground);
  } else {
    // 地面拆成四塊：高台(x0-10) + 三格階梯緩坡(x11,12,13) + 低地沙灘/海(x14+)。
    // 相鄰方塊高度不同，交界處自然露出垂直側面，那就是「階梯」的視覺來源，
    // 不用額外建模階梯形狀
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c });
    const zCenter = (rows * TILE) / 2 - TILE / 2;
    function groundSlab(xStart, xEnd, height) {
      const width = xEnd - xStart;
      const northExtension = NORTH_TERRAIN_EXTENSION;
      const depth = rows * TILE + northExtension;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(width, 0.2, depth), grassMat);
      slab.position.set((xStart + xEnd) / 2 - 0.5, height - 0.1, zCenter - northExtension / 2);
      slab.receiveShadow = true; slab.castShadow = true;
      mapGroup.add(slab);
    }
    const rampX = LAYOUT.coast.rampX;
    const lowlandX = rampX + LAYOUT.coast.rampWidth;
    groundSlab(0, rampX, PLATEAU_Y);
    const lowlandMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c });
    const cliffMat2 = new THREE.MeshStandardMaterial({ color: 0x8a8478, flatShading: true });
    const pathMat = new THREE.MeshStandardMaterial({ color: 0xbfa172 });
    for (let z = -NORTH_TERRAIN_EXTENSION; z < Math.min(rows, TOWN_Z_START); z++) {
      const inCorridor = z >= RAMP_CORRIDOR_MIN_Z && z <= RAMP_CORRIDOR_MAX_Z;
      if (inCorridor) {
        // 走廊：三級台階，用路面色而不是草色，讀起來像「這是特地留的一條路」
        [[rampX, PLATEAU_Y * 0.75], [rampX + 1, PLATEAU_Y * 0.5], [rampX + 2, PLATEAU_Y * 0.25]].forEach(([sx, sy]) => {
          const step = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, TILE), pathMat);
          step.position.set(sx, sy - 0.1, z);
          step.receiveShadow = true; step.castShadow = true;
          mapGroup.add(step);
        });
      } else {
        // 懸崖：一整片垂直岩壁，從高台頂端封到海平面，這裡走不過去
        const wall = new THREE.Mesh(new THREE.BoxGeometry(3, PLATEAU_Y + 0.3, TILE * 0.96), cliffMat2);
        wall.position.set(rampX + 1, PLATEAU_Y / 2 - 0.05, z);
        wall.castShadow = true; wall.receiveShadow = true;
        mapGroup.add(wall);
        // 崖底偶爾堆一顆放大的石頭，呼應參考圖那種亂石礁岸的感覺
        if (hash2(z * 3.1, 8.8) < 0.55) {
          const boulder = makeStone(rampX + hash2(z, 1) * 2.3, z + (hash2(z, 2) - 0.5) * 0.6, hash2(z, 3));
          boulder.scale.setScalar(1.7 + hash2(z, 4) * 1.6);
          mapGroup.add(boulder);
        }
      }
    }
    const extendedDepth = rows * TILE + NORTH_TERRAIN_EXTENSION;
    const lowland = new THREE.Mesh(new THREE.BoxGeometry(cols - lowlandX, 0.2, extendedDepth),
      new THREE.MeshStandardMaterial({ color: 0x6ab04c }));
    lowland.position.set(lowlandX + (cols - lowlandX) / 2 - 0.5, -0.1,
      zCenter - NORTH_TERRAIN_EXTENSION / 2);
    lowland.receiveShadow = true;
    mapGroup.add(lowland);

    // 右側沙灘也往北補齊，接住延伸後的海面與海堤，不留下綠色斷帶。
    const northOceanStartX = map.tiles[0].indexOf(9);
    if (northOceanStartX > lowlandX) {
      const northSandWidth = northOceanStartX - lowlandX;
      const northSand = new THREE.Mesh(
        new THREE.PlaneGeometry(northSandWidth, NORTH_TERRAIN_EXTENSION),
        new THREE.MeshStandardMaterial({ color: 0xe8d29a })
      );
      northSand.rotation.x = -Math.PI / 2;
      northSand.position.set(lowlandX + northSandWidth / 2 - 0.5, 0.015,
        -NORTH_TERRAIN_EXTENSION / 2 - 0.5);
      mapGroup.add(northSand);
    }

    // 北側懸崖 + 遠方海景 —— 純背景，跟西側遠山同一招：z 是負的，isBlocked
    // 本來就會把超出邊界的座標判定為擋路，走不進去，不用額外寫碰撞。
    // 沒有真的把海延伸到北邊（那需要海面系統支援兩塊不相連的水域，成本
    // 不成比例），做的是懸崖峭壁 + 崖底沙灘沿 + 亂石 + 遠方海水色背景板，
    // 「沙灘在崖底止住」這個視覺效果做出來了，但沙灘本身不能走進去
    const northCliffStartX = -0.5;
    const northCliffEndX = LAYOUT.coast.rampX + LAYOUT.coast.rampWidth - 0.5;
    const cliffMat = new THREE.MeshStandardMaterial({ color: 0x8a8478, flatShading: true });
    const railMat = new THREE.MeshStandardMaterial({ color: 0x594231, flatShading: true, roughness: 0.9 });
    const cliffEdge = [];
    for (let x = northCliffStartX; x < northCliffEndX; x += 1) {
      const centerX = x + 0.5;
      const edgeZ = northCliffEdgeZ(centerX);
      const wallHeight = PLATEAU_Y + 0.12 + hash2(centerX * 4.7, 2.3) * 0.28;
      const wallDepth = 0.48 + hash2(centerX * 2.9, 9.1) * 0.28;
      const wall = new THREE.Mesh(new THREE.BoxGeometry(1.08, wallHeight, wallDepth), cliffMat);
      wall.position.set(centerX, wallHeight / 2 - 0.08, edgeZ);
      wall.rotation.y = (hash2(centerX, 5.6) - 0.5) * 0.08;
      wall.castShadow = true; wall.receiveShadow = true;
      mapGroup.add(wall);
      cliffEdge.push({ x: centerX, z: edgeZ + wallDepth * 0.42, top: wallHeight - 0.08 });
    }
    // 木製護欄跟著不規則崖線逐段連接；雙橫桿讓遠景仍看得清楚。
    cliffEdge.forEach((point, i) => {
      if (i % 2 === 0) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.075, 0.82, 6), railMat);
        post.position.set(point.x, point.top + 0.4, point.z);
        post.castShadow = true;
        mapGroup.add(post);
      }
      if (i === cliffEdge.length - 1) return;
      const next = cliffEdge[i + 1];
      const dx = next.x - point.x, dz = next.z - point.z;
      const length = Math.hypot(dx, dz);
      [0.28, 0.62].forEach(railHeight => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(length + 0.06, 0.075, 0.075), railMat);
        rail.position.set((point.x + next.x) / 2,
          (point.top + next.top) / 2 + railHeight, (point.z + next.z) / 2);
        rail.rotation.y = -Math.atan2(dz, dx);
        rail.castShadow = true;
        mapGroup.add(rail);
      });
    });
    const sandFringe = new THREE.Mesh(new THREE.PlaneGeometry(13, 2.4),
      new THREE.MeshStandardMaterial({ color: 0xe8d29a }));
    sandFringe.rotation.x = -Math.PI / 2;
    sandFringe.position.set(5, 0.01, -7.1);
    mapGroup.add(sandFringe);
    for (let i = 0; i < 6; i++) {
      const bx = hash2(i * 5.1, 2.2), bz = hash2(i * 2.7, 6.6);
      const boulder = makeStone(bx * 11, -6.2 - bz * 1.5, bx);
      boulder.scale.setScalar(1.4 + bz * 1.8);
      mapGroup.add(boulder);
    }
    // 北海只露出約三格深的動態海帶，後方留給天空／夜空；右端與東海重疊。
    const northSeaWidth = cols + 4;
    const northSeaDepth = 3.2;
    const northSeaNearZ = NORTH_CLIFF_Z - 0.2;
    const northSeaCenterX = (cols - 1) / 2;
    const sgGeo = new THREE.PlaneGeometry(northSeaWidth, northSeaDepth, 30, 8);
    sgGeo.rotateX(-Math.PI / 2);
    const sgPos = sgGeo.attributes.position;
    const sgBase = new Float32Array(sgPos.count * 3);
    const sgColors = new Float32Array(sgPos.count * 3);
    const near = new THREE.Color(0x4a90c8), far = new THREE.Color(0x9fc4dd);
    for (let i = 0; i < sgPos.count; i++) {
      sgBase[i * 3] = sgPos.getX(i);
      sgBase[i * 3 + 1] = sgPos.getY(i);
      sgBase[i * 3 + 2] = sgPos.getZ(i);
      const t = Math.min(1, Math.max(0,
        (northSeaDepth / 2 - sgPos.getZ(i)) / northSeaDepth));
      const worldX = sgPos.getX(i) + northSeaCenterX;
      const eastMixRaw = Math.max(0, Math.min(1,
        (worldX - (LAYOUT.coast.rampX - 2)) / 7));
      const eastMix = eastMixRaw * eastMixRaw * (3 - 2 * eastMixRaw);
      const c = near.clone().lerp(far, t).lerp(new THREE.Color(0x2f6fae), eastMix);
      sgColors[i * 3] = c.r; sgColors[i * 3 + 1] = c.g; sgColors[i * 3 + 2] = c.b;
    }
    sgGeo.setAttribute('color', new THREE.BufferAttribute(sgColors, 3));
    sgGeo.userData = { basePositions: sgBase };
    seaGlimpseMesh = new THREE.Mesh(sgGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.23, metalness: 0.08,
      transparent: true, opacity: 0.92, side: THREE.DoubleSide,
    }));
    seaGlimpseMesh.position.set(northSeaCenterX, 0.13, northSeaNearZ - northSeaDepth / 2);
    mapGroup.add(seaGlimpseMesh);

    // 固定在高台上的東西(建築、農地、湖、牧草、遠山)統一掛在這個群組下面，
    // 整組往上抬 PLATEAU_Y，不用逐一調整每個物件的座標
    plateauGroup = new THREE.Group();
    plateauGroup.position.y = PLATEAU_Y;
    mapGroup.add(plateauGroup);
  }

  (map.buildings || []).forEach(b => plateauGroup.add(b.style === 'barn' ? makeBarn(b) : makeBuilding(b)));
  (map.furniture || []).forEach(item => {
    const w = item.w || 1, d = item.d || 1;
    const mesh = makeFurniture(item);
    mesh.position.set(item.x + (w - 1) / 2, 0, item.z + (d - 1) / 2);
    plateauGroup.add(mesh);
  });

  houseLampLight = null; houseLampBulbMat = null;
  if (mapName === 'house') {
    const lamp = makeLamp();
    lamp.group.position.set(5, 0.45, 2); // 桌上，桌面高度約 0.45
    plateauGroup.add(lamp.group);
    houseLampLight = lamp.light;
    houseLampBulbMat = lamp.bulbMat;
  }

  avenueLeafMaterials.length = 0;
  map.tiles.forEach((row, z) => {
    row.forEach((tile, x) => {
      if (tile === 1 && mapName === 'house') {
        const winEntry = (map.windows || []).find(w => w.x === x && w.z === z);
        plateauGroup.add(makeInteriorWall(x, z, winEntry ? winEntry.side : null));
      }
      else if (tile === 2) {
        const m = mapName === 'outside' && AVENUE_TREE_KEYS.has(`${x},${z}`)
          ? makeAvenueTree(x, z) : makeTree(x, z);
        m.position.y += groundY(x);
        mapGroup.add(m);
      }
      else if (tile === 3) {
        const threshold = new THREE.Mesh(new THREE.BoxGeometry(TILE * 0.9, 0.06, TILE * 0.9),
          new THREE.MeshStandardMaterial({ color: 0xf5c542 }));
        threshold.position.set(x, 0.03 + (mapName === 'outside' ? groundY(x) : 0), z);
        mapGroup.add(threshold);
      } else if (tile === 5) { const m = makePath(x, z); m.position.y += groundY(x); mapGroup.add(m); }
      // tile === 6（湖）不逐格建置，改成迴圈結束後蓋成一整片有波紋的水面
      else if (tile === 8) {
        mapGroup.add(makeSand(x, z));
        const r = hash2(x * 4.3, z * 2.1);
        if (r < 0.12) mapGroup.add(makeStone(x + (r - 0.5) * 0.3, z + (r - 0.5) * 0.3, r * 0.6));
      }
      // tile === 9（海）不逐格建置，迴圈結束後另外蓋成一整片海面，才能做波浪動畫
      else if (tile === 0 && mapName === 'outside') {
        if (x === POUCH_POS.x && z === POUCH_POS.z) return;
        const insideArea = area => x >= area.x && x < area.x + area.width
          && z >= area.z && z < area.z + area.height;
        if (insideArea(LAYOUT.restArea) || insideArea(LAYOUT.garden)) return;
        if (x >= 14 && x <= 16) return; // 坡道走廊留乾淨，不要長裝飾把路擋亂
        const r = hash2(x * 3.1, z * 7.7);
        const gy = groundY(x);
        if (r < 0.1) { const m = makeGrassTuft(x + (r - 0.5) * 0.4, z + (r - 0.5) * 0.4, r); m.position.y += gy; mapGroup.add(m); }
        else if (r < 0.14) { const m = makeFlower(x + (r - 0.5) * 0.4, z + (r - 0.5) * 0.4, FLOWER_COLORS[Math.floor(r * 100) % 4]); m.position.y += gy; mapGroup.add(m); }
        else if (r < 0.17) { const m = makeStone(x + (r - 0.5) * 0.4, z + (r - 0.5) * 0.4, r); m.position.y += gy; mapGroup.add(m); }
      }
    });
  });

  // 海面：支援頂點著色（浪頭捲到最高點時自動染白模擬碎浪），網格加密讓
  // 捲浪的幾何細節看得出來；只涵蓋 tile 9 的範圍，動畫在 animate() 逐頂點更新
  foamMeshes.length = 0;
  oceanMesh = null;
  lakeMesh = null;
  lakeShoreColliders.length = 0;
  seaGlimpseMesh = null;
  fishSchool.length = 0;
  pastureGrassBlades.length = 0;
  if (mapName === 'outside') {
    // 海面不再是一塊矩形 PlaneGeometry——那樣不管沙灘/海怎麼抖動，海面
    // 西緣永遠是直線，會整片蓋掉抖動出來的沙灘。改成逐排(z)照當排實際
    // 沙灘/海分界點織一條緞帶狀網格，西緣（岸邊）跟著陣列裡的抖動走，
    // 東緣（外海）維持平直即可，看不到也不需要不規則
    const westXByZ = [];
    let globalMaxX = -Infinity;
    for (let z = 0; z < map.tiles.length; z++) {
      const row = map.tiles[z];
      const firstOceanX = row.indexOf(9);
      if (firstOceanX === -1) { westXByZ[z] = null; continue; }
      westXByZ[z] = firstOceanX - 0.5;
      for (let x = row.length - 1; x >= 0; x--) { if (row[x] === 9) { globalMaxX = Math.max(globalMaxX, x + 0.5); break; } }
    }
    const validZ = westXByZ.reduce((acc, v, z) => { if (v !== null) acc.push(z); return acc; }, []);
    if (validZ.length) {
      const dataMinZ = validZ[0], minZ = -NORTH_TERRAIN_EXTENSION;
      const maxZ = validZ[validZ.length - 1];
      const minX = Math.min(...westXByZ.filter(v => v !== null));
      const maxX = globalMaxX;
      const width = maxX - minX, depth = maxZ - minZ;

      const westXAt = (z) => {
        if (z <= dataMinZ) return westXByZ[dataMinZ];
        const zLo = Math.max(dataMinZ, Math.min(maxZ, Math.floor(z)));
        const zHi = Math.min(maxZ, zLo + 1);
        const wLo = westXByZ[zLo], wHi = westXByZ[zHi] != null ? westXByZ[zHi] : wLo;
        const t = zHi === zLo ? 0 : (z - zLo) / (zHi - zLo);
        return wLo + (wHi - wLo) * t;
      };

      const ZSUB = 2; // 每個 tile 排再細分幾段，波浪動畫才夠滑順
      const rowsZ = [];
      for (let z = minZ; z < maxZ; z++) { for (let s = 0; s < ZSUB; s++) rowsZ.push(z + s / ZSUB); }
      rowsZ.push(maxZ);
      const COLS = Math.max(4, Math.round(width * 3));

      // 欄位用固定世界座標（每一排都是同一組 x），不要照各排西緣重新內插
      // ——內插會讓相鄰排的同一欄位落在不同的絕對 x，格子被拉斜，疊上波浪
      // 動畫的正弦相位後會出現對角條紋。改成每排只把落在陸地那側的頂點
      // 「夾」到該排的西緣，退化成貼齊邊界的窄三角形，欄位本身不歪斜
      const positions = [], colors = [];
      rowsZ.forEach(z => {
        const westX = westXAt(z);
        for (let c = 0; c <= COLS; c++) {
          const t = c / COLS;
          const gridX = minX + (maxX - minX) * t;
          positions.push(Math.max(gridX, westX), 0, z);
          colors.push(0.18, 0.43, 0.68); // 0x2f6fae
        }
      });
      const indices = [];
      const rowLen = COLS + 1;
      for (let r = 0; r < rowsZ.length - 1; r++) {
        for (let c = 0; c < COLS; c++) {
          const i0 = r * rowLen + c, i1 = r * rowLen + c + 1;
          const i2 = (r + 1) * rowLen + c, i3 = (r + 1) * rowLen + c + 1;
          indices.push(i0, i2, i1, i1, i2, i3);
        }
      }

      // 幫每個頂點記錄「原始座標」：波浪位移一定要從固定的原始位置重算，
      // 不能直接在目前位置上疊加，不然每幀都會愈飄愈遠。顏色則用來畫浪頭泡沫
      const posArray = new Float32Array(positions);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData = { basePositions: posArray.slice() };

      oceanMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.2, metalness: 0.1, flatShading: true,
        transparent: true, opacity: 0.92,
      }));
      // 頂點座標已經是世界座標（每排西緣各自不同，不能再用單一中心點套用
      // PlaneGeometry 的本地座標系），mesh 本身只需要負責 y 的抬高量。
      // y 抬高一點：波浪的位移量如果蓋過地面（y=0）就會被不透明的地面擋住，
      // 變成海面中間破一個洞。留出安全間距讓波浪永遠浮在地面之上
      oceanMesh.position.set(0, 0.13, 0);
      oceanMesh.receiveShadow = true;
      mapGroup.add(oceanMesh);

      // 沙灘跟海交界處各放一組會捲上岸、碎開、又退回去的浪花
      map.tiles.forEach((row, z) => {
        const shoreX = row.findIndex(t => t === 9);
        if (shoreX > 0) {
          const foam = makeFoam(shoreX - 0.35, z, z * 1.37);
          foamMeshes.push(foam);
          mapGroup.add(foam);
        }
      });

      // 海魚使用大範圍的長直線巡游；安全邊界取所有海岸線中最靠右的一排，
      // 避免沿 z 直游時切進凹凸不規則的沙灘。
      fishSchool.length = 0;
      const FISH_COUNT = 6;
      const safeSeaMinX = Math.max(...westXByZ.filter(v => v !== null)) + 0.7;
      for (let i = 0; i < FISH_COUNT; i++) {
        const s1 = hash2(i * 3.1, i * 7.7), s2 = hash2(i * 5.3, i * 2.9);
        const cx = safeSeaMinX + s1 * Math.max(0.2, maxX - 0.7 - safeSeaMinX);
        const cz = minZ + 0.7 + s2 * Math.max(0.2, depth - 1.4);
        const mesh = makeFishProp(i);
        const scale = SEA_FISH_SCALE * (0.78 + hash2(i, 19.7) * 0.48);
        mesh.scale.setScalar(scale);
        mesh.position.set(cx, oceanMesh.position.y - 0.045, cz);
        mapGroup.add(mesh);
        const fish = {
          mesh, phase: s1 * Math.PI * 2,
          swimSpeed: 0.34 + s2 * 0.32,
          curveAmount: 0.18 + s1 * 0.32,
          baseY: oceanMesh.position.y - 0.045,
          depthAmp: 0.012 + s1 * 0.025,
          bounds: { minX: safeSeaMinX, maxX: maxX - 0.7, minZ: minZ + 0.7, maxZ: maxZ - 0.7 },
          route: null, pauseUntil: elapsed + s2 * 1.5,
        };
        fishSchool.push(fish);
      }
    }

    // 每格以三個完全散點的合併草叢覆蓋，不再使用固定 2×2 排列；高度由跨格
    // 的低頻波形混合細微亂數，避免同一 tile 四叢同高造成棋盤式分隔。
    for (let gx = PASTURE.minX; gx <= PASTURE.maxX; gx++) {
      for (let gz = PASTURE.minZ; gz <= PASTURE.maxZ; gz++) {
        if (!hasPastureGrassAt(gx, gz)) continue;
        for (let i = 0; i < 3; i++) {
          const seed = hash2(gx * 7.1 + i * 2.3, gz * 5.9 + i * 4.7);
          const jx = gx + (hash2(gx + i * 11.3, gz * 2.1 + i) - 0.5) * 0.94;
          const jz = gz + (hash2(gz + i * 13.7, gx * 3.4 + i) - 0.5) * 0.94;
          const broadGrowth = 1.5
            + Math.sin(jx * 0.43 + jz * 0.18) * 0.62
            + Math.cos(jz * 0.37 - jx * 0.12) * 0.48
            + (seed - 0.5) * 0.34;
          const tuft = makeWindGrass(jx, jz, seed);
          tuft.userData.growth = Math.max(0.08, Math.min(2.98, broadGrowth));
          tuft.rotation.y = seed * Math.PI * 2;
          const widthScale = 0.88 + hash2(seed * 8.4, 1.7) * 0.28;
          tuft.scale.x = widthScale; tuft.scale.z = widthScale;
          plateauGroup.add(tuft);
          pastureGrassBlades.push(tuft);
        }
      }
    }

    // 依山傍海：海在東側，山放在西側邊界外，人站在房子附近往兩邊看
    // 會同時感覺到背後有山、前面有海——這是純景觀，不能走進去
    const MOUNTAIN_COUNT = 10;
    for (let i = 0; i < MOUNTAIN_COUNT; i++) {
      const s = hash2(i * 9.7, i * 3.1);
      const mz = (i / (MOUNTAIN_COUNT - 1)) * (rows - 1);
      const height = 1.6 + s * 1.9;
      plateauGroup.add(makeMountain(LAYOUT.mountainBand.x + s * (LAYOUT.mountainBand.width - 1), mz, height, s));
    }

    // 小屋右側果園：3×4 共 12 棵，間距加大並為每棵配置不同果色與葉色。
    for (let ox = 0; ox < LAYOUT.orchard.columns; ox++) {
      for (let oz = 0; oz < LAYOUT.orchard.rows; oz++) {
        const index = ox * LAYOUT.orchard.rows + oz;
        const fx = LAYOUT.orchard.x + ox * LAYOUT.orchard.spacingX + (hash2(ox, oz) - 0.5) * 0.2;
        const fz = LAYOUT.orchard.z + oz * LAYOUT.orchard.spacingZ + (hash2(oz, ox) - 0.5) * 0.2;
        plateauGroup.add(makeFruitTree(fx, fz, hash2(fx, fz), index));
      }
    }

    // 瀑布——湖西側邊緣，靜態占位，還沒做真的水流動畫
    plateauGroup.add(makeWaterfallPlaceholder(LAYOUT.lake.x + 0.5, LAYOUT.lake.z + 3));

    // 行道樹右側正式分成上下兩區：上方聚會／個人放鬆，下方小花園。
    plateauGroup.add(makeRestArea(LAYOUT.restArea));
    plateauGroup.add(makeSmallGarden(LAYOUT.garden));

    // 海堤入口左右各一盞路燈，燈頭朝向道路中央。
    const lampX = LAYOUT.coast.rampX - 1.15;
    plateauGroup.add(makeStreetLamp(lampX, COAST_ROAD_CENTER_Z - COAST_ROAD_HALF_WIDTH - 0.55, 1));
    plateauGroup.add(makeStreetLamp(lampX, COAST_ROAD_CENTER_Z + COAST_ROAD_HALF_WIDTH + 0.55, -1));

    // 湖：不再是矩形平面，改成手刻的極座標網格——從中心點往外拉幾圈同心圓，
    // 每個角度的半徑疊加幾層不同頻率的正弦波，做出雲朵/天然湖泊那種不規則
    // 但平滑的輪廓，不是幾個角的多邊形。三角化方式是標準的「相鄰兩圈連成
    // 三角形」做法，中心密、邊緣疏，整片仍然是一個網格，波紋動畫照樣能用
    const lakeCells = [];
    map.tiles.forEach((row, z) => row.forEach((t, x) => { if (t === 6) lakeCells.push({ x, z }); }));
    if (lakeCells.length) {
      const centerX = LAYOUT.lake.x + (LAYOUT.lake.width - 1) / 2;
      const centerZ = LAYOUT.lake.z + (LAYOUT.lake.height - 1) / 2;
      const seed = hash2(centerX * 1.7, centerZ * 2.3) * 20;
      const radiusX = LAYOUT.lake.width * 0.35;
      const radiusZ = LAYOUT.lake.height * 0.35;

      const ANGLE_SEG = 32, RING_SEG = 7;
      const angleRadius = [];
      for (let a = 0; a <= ANGLE_SEG; a++) {
        const theta = (a / ANGLE_SEG) * Math.PI * 2;
        angleRadius.push(lakeEdgeFactor(theta));
      }
      angleRadius[ANGLE_SEG] = angleRadius[0]; // 頭尾接起來，輪廓才會閉合

      const positions = [];
      const colors = [];
      for (let ring = 0; ring <= RING_SEG; ring++) {
        const ringFrac = ring / RING_SEG;
        for (let a = 0; a <= ANGLE_SEG; a++) {
          const theta = (a / ANGLE_SEG) * Math.PI * 2;
          const r = angleRadius[a] * ringFrac;
          positions.push(Math.cos(theta) * radiusX * r, 0, Math.sin(theta) * radiusZ * r);
          // 中心偏深藍，邊緣淡成偏綠的淺水色——湖底透光的感覺
          const edge = ringFrac;
          colors.push(0.13 + edge * 0.30, 0.36 + edge * 0.32, 0.52 + edge * 0.20);
        }
      }
      const indices = [];
      const rowLen = ANGLE_SEG + 1;
      for (let ring = 0; ring < RING_SEG; ring++) {
        for (let a = 0; a < ANGLE_SEG; a++) {
          const i0 = ring * rowLen + a, i1 = ring * rowLen + a + 1;
          const i2 = (ring + 1) * rowLen + a, i3 = (ring + 1) * rowLen + a + 1;
          indices.push(i0, i2, i1, i1, i2, i3);
        }
      }

      const posArray = new Float32Array(positions);
      const lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      lGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
      lGeo.setIndex(indices);
      lGeo.computeVertexNormals();
      lGeo.userData = { basePositions: posArray.slice() };

      lakeMesh = new THREE.Mesh(lGeo, new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.16, metalness: 0.12,
        transparent: true, opacity: 0.9, side: THREE.DoubleSide,
      }));
      lakeMesh.position.set(centerX, 0.1, centerZ);
      lakeMesh.receiveShadow = true; // 房子跟樹的影子可以真的落在水面上
      plateauGroup.add(lakeMesh);

      // 大石完整圍住湖岸，間距小於石頭直徑，讓相鄰石塊自然重疊、沒有缺口。
      const SHORE_ROCK_COUNT = 72;
      for (let i = 0; i < SHORE_ROCK_COUNT; i++) {
        const theta = (i / SHORE_ROCK_COUNT) * Math.PI * 2 + 0.04;
        const edge = lakeEdgeFactor(theta);
        const jitter = (hash2(i * 5.7, seed + i) - 0.5) * 0.12;
        const rockX = centerX + Math.cos(theta) * (radiusX * edge + 0.26 + jitter);
        const rockZ = centerZ + Math.sin(theta) * (radiusZ * edge + 0.26 + jitter);
        const isSeat = i % 10 === 0;
        plateauGroup.add(makeLakeShoreRock(rockX, rockZ, hash2(seed + i * 3.1, i * 7.9), isSeat));
        lakeShoreColliders.push({ x: rockX, z: rockZ, radius: isSeat ? 0.38 : 0.3 });
      }

      // 幾片睡蓮葉，浮在水面上——低成本但很有效的「這是一座湖」視覺訊號
      const padCount = 3;
      for (let i = 0; i < padCount; i++) {
        const pr = hash2(seed + i * 4.1, i * 1.3);
        const pa = hash2(i * 7.7, seed + i * 2.9) * Math.PI * 2;
        const distX = radiusX * (0.15 + pr * 0.45);
        const distZ = radiusZ * (0.15 + pr * 0.45);
        const pad = new THREE.Mesh(new THREE.CircleGeometry(0.09 + pr * 0.05, 8),
          new THREE.MeshStandardMaterial({ color: 0x3f9142, flatShading: true, side: THREE.DoubleSide }));
        pad.rotation.x = -Math.PI / 2;
        pad.position.set(centerX + Math.cos(pa) * distX, 0.135, centerZ + Math.sin(pa) * distZ);
        plateauGroup.add(pad);
      }

      // 湖中魚群使用湖心內縮後的安全矩形，能長距離橫游／縱游又不越岸。
      const LAKE_FISH_COUNT = 5;
      for (let i = 0; i < LAKE_FISH_COUNT; i++) {
        const s1 = hash2(40 + i * 3.7, 12 + i * 6.1);
        const s2 = hash2(70 + i * 5.3, 21 + i * 2.9);
        const angle = (i / LAKE_FISH_COUNT) * Math.PI * 2 + s1 * 0.5;
        const cx = centerX + Math.cos(angle) * radiusX * (0.12 + s1 * 0.22);
        const cz = centerZ + Math.sin(angle) * radiusZ * (0.12 + s2 * 0.22);
        const mesh = makeFishProp(100 + i);
        const scale = LAKE_FISH_SCALE * (0.8 + hash2(100 + i, 31.4) * 0.42);
        mesh.scale.setScalar(scale);
        mesh.position.set(cx, lakeMesh.position.y - 0.045, cz);
        plateauGroup.add(mesh);
        const fish = {
          mesh, phase: s2 * Math.PI * 2,
          swimSpeed: 0.24 + s2 * 0.23,
          curveAmount: 0.1 + s1 * 0.18,
          baseY: lakeMesh.position.y - 0.045,
          depthAmp: 0.008 + s2 * 0.014,
          bounds: {
            minX: centerX - radiusX * 0.45, maxX: centerX + radiusX * 0.45,
            minZ: centerZ - radiusZ * 0.45, maxZ: centerZ + radiusZ * 0.45,
          },
          route: null, pauseUntil: elapsed + s1 * 2,
        };
        fishSchool.push(fish);
      }
    }
  }

  scene.add(mapGroup);
  currentMapName = mapName;
  npcGroup.visible = mapName === 'outside';
  animalGroup.visible = mapName === 'outside';
  syncFarmVisuals();
}

function isBlocked(mapName, x, z) {
  const map = MAPS[mapName];
  const tx = Math.round(x), tz = Math.round(z);
  // 北側延伸高台允許負 z；先檢查位於該區的小屋，避免提前返回漏掉碰撞。
  if ((map.buildings || []).some(building =>
    tx >= building.x && tx < building.x + building.w
    && tz >= building.z && tz < building.z + building.d)) return true;
  if (mapName === 'outside' && z < 0) {
    const onNorthPlateau = x >= 0 && x < LAYOUT.coast.rampX
      && z >= northCliffEdgeZ(x) + 0.62;
    return !onNorthPlateau;
  }
  if (tz < 0 || tz >= map.tiles.length || tx < 0 || tx >= map.tiles[0].length) return true;
  if (mapName === 'outside' && lakeShoreColliders.some(rock =>
    Math.hypot(x - rock.x, z - rock.z) < rock.radius)) return true;
  if (mapName === 'outside' && isInsideLakeShape(x, z)) return true;
  const t = map.tiles[tz][tx];
  if (t === 6) return true;
  if (t === 1 || t === 2 || t === 9) return true;
  if (map.furniture) {
    return map.furniture.some(f => {
      if (f.nonBlocking) return false;
      const w = f.w || 1, d = f.d || 1;
      return tx >= f.x && tx < f.x + w && tz >= f.z && tz < f.z + d;
    });
  }
  return false;
}

function loadMap(mapName, startPos) {
  fadeOut(() => {
    buildMap(mapName);
    const pos = startPos || MAPS[mapName].playerStart;
    playerGridPos = { x: pos.x, z: pos.z };
    if (!player) {
      player = makeGirlPlayer();
      scene.add(player);
    }
    player.position.x = playerGridPos.x;
    player.position.z = playerGridPos.z;
    fadeIn();
  });
}

const fadeEl = document.getElementById('fade');
function fadeOut(cb) { fadeEl.style.opacity = 1; setTimeout(cb, 400); }
function fadeIn() { setTimeout(() => fadeEl.style.opacity = 0, 50); }

const dialogEl = document.getElementById('dialog');
function showDialog(text) {
  dialogEl.textContent = text;
  dialogEl.style.display = dialogEl.style.display === 'none' || !dialogEl.style.display ? 'block' : 'none';
}
// 多句對話用的小佇列——按 E 一句一句往下推，最後一句再按一次才關掉。
// 單句對話還是用上面的 showDialog()，這個只給需要「一來一往」的場景用
let dialogQueue = [];
let dialogIndex = 0;
function showDialogSequence(lines) {
  dialogQueue = lines;
  dialogIndex = 0;
  dialogEl.textContent = dialogQueue[0];
  dialogEl.style.display = 'block';
}
function advanceDialogSequence() {
  dialogIndex++;
  if (dialogIndex >= dialogQueue.length) {
    dialogEl.style.display = 'none';
    dialogQueue = [];
    return;
  }
  dialogEl.textContent = dialogQueue[dialogIndex];
}

const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('wheel', e => {
  zoom = Math.max(2, Math.min(18, zoom + e.deltaY * 0.01));
  updateCameraFrustum();
});

let ePressed = false;
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'e' || ePressed) return;
  ePressed = true;

  // 對話正在進行中：E 只用來往下推句子，不觸發任何其他動作
  if (dialogQueue.length) { advanceDialogSequence(); return; }

  const scripted = events
    .filter(ev => ev.map === currentMapName && ev.trigger === 'interact')
    .filter(ev => Math.abs(ev.x - playerGridPos.x) + Math.abs(ev.z - playerGridPos.z) <= 1);
  if (scripted.length) { scripted.forEach(ev => ev.action()); return; }

  if (currentMapName === 'outside') {
    const nearby = npcs.find(n => {
      const dx = player.position.x - n.mesh.position.x, dz = player.position.z - n.mesh.position.z;
      return Math.sqrt(dx * dx + dz * dz) <= 1.3;
    });
    if (nearby) {
      showDialog(npcLine(nearby));
      return;
    }
  }

  if (currentMapName === 'outside' && nearWater()) {
    if (fishingState === 'idle') {
      fishingState = 'casting';
      fishingTimer = 0;
      biteWaitTime = 1.4 + Math.random() * 2.6;
      bobberMesh = makeBobber();
      scene.add(bobberMesh);
      castAnimEnd = elapsed + CAST_ANIM_DURATION;
      if (player.parts.rod) player.parts.rod.visible = true;
    } else if (fishingState === 'biting') {
      inventory.fish++;
      fishingState = 'idle';
      const catchFrom = bobberMesh ? bobberMesh.position.clone() : player.position.clone();
      if (bobberMesh) { scene.remove(bobberMesh); bobberMesh = null; }
      if (player.parts.rod) player.parts.rod.visible = false;
      fishFeedback = { text: '釣到一隻魚！', until: elapsed + 1.4 };
      const flyingFish = makeFishProp(Math.random() * 100);
      flyingFish.scale.setScalar(1.7);
      scene.add(flyingFish);
      catchAnim = { mesh: flyingFish, from: catchFrom, start: elapsed, duration: 0.7 };
    }
    // casting 中途按 E 沒有作用——心急沒有用，這也是釣魚小遊戲的重點
    return;
  }

  if (currentMapName !== 'outside') return;
  const { x, z } = playerGridPos;
  if (x === POUCH_POS.x && z === POUCH_POS.z) { pickupSeeds(); return; }
  const onFarmland = FARMLAND_TILES.some(([fx, fz]) => fx === x && fz === z);
  if (onFarmland) {
    const key = `${x},${z}`;
    if (cropState[key] && cropState[key].stage >= 2) harvestCrop(x, z);
    else if (!cropState[key]) plantSeed(x, z);
  }
});
addEventListener('keyup', e => { if (e.key.toLowerCase() === 'e') ePressed = false; });

// 自由移動的碰撞判斷：玩家當成一個小正方形，四個角落分別去查
// 「這個角落現在在哪個格子、那格能不能走」，任何一個角落撞到就擋住，
// 這樣貼著牆邊走的時候是滑過去，不是整個人卡住
function collidesAt(mapName, x, z, half = 0.22) {
  const corners = [
    [x - half, z - half], [x + half, z - half],
    [x - half, z + half], [x + half, z + half],
  ];
  return corners.some(([cx, cz]) => isBlocked(mapName, cx, cz));
}

window.__gameState = () => ({
  playerGridPos, currentMapName, facing, isMoving,
  nightFactor: window.__nightFactor || 0,
  season: SEASON_NAMES[currentSeason], weather: WEATHER_NAMES[currentWeather], musicMuted,
  dialogVisible: dialogEl.style.display === 'block',
  day: currentDay, inventory: { ...inventory }, fishingState,
  npcs: npcs.map(n => ({ id: n.id, memory: n.memory, pos: { x: n.mesh.position.x, z: n.mesh.position.z } })),
  crops: JSON.parse(JSON.stringify(cropState)),
});

const hudEl = document.getElementById('hud');
function updateHud() {
  const hh = Math.floor(((elapsed % dayLength) / dayLength) * 24);
  hudEl.innerHTML = `第 <b>${currentDay + 1}</b> 天 ・ ${SEASON_NAMES[currentSeason]}季 ・ ${WEATHER_NAMES[currentWeather]} ・ ${String(hh).padStart(2,'0')}:00${musicMuted ? ' ・ 靜音' : ''}<br>種子 <b>${inventory.seeds}</b> ・ 收成 <b>${inventory.harvested}</b> ・ 魚 <b>${inventory.fish}</b><br>阿姨印象 <b>${npcs[0].memory}</b> ・ 木匠印象 <b>${npcs[1].memory}</b>`;
}

let lastFrame = performance.now();
let prevDay = 0;
let animationFrameCount = 0;
let grassAnimationAccumulator = 0;
let hudUpdateAccumulator = 0;
function animate(now) {
  requestAnimationFrame(animate);
  if (!player) return;
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  elapsed += dt;
  animationFrameCount++;
  const updateWaterSurface = animationFrameCount % 2 === 0; // 水面維持約 30fps，減少大量頂點運算

  // --- 自由移動：方向鍵給的是速度向量，不是格子跳，可以八方向、可以貼牆滑 ---
  let dx = 0, dz = 0;
  if (keys['w'] || keys['arrowup']) dz -= 1;
  if (keys['s'] || keys['arrowdown']) dz += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const inputLen = Math.hypot(dx, dz);
  isMoving = inputLen > 0;
  if (inputLen > 0) { dx /= inputLen; dz /= inputLen; }

  const moveSpeed = 10; // 格/秒
  const stepX = dx * moveSpeed * dt, stepZ = dz * moveSpeed * dt;
  // X / Z 分開檢查碰撞，撞到一個軸還能沿著另一個軸繼續滑，這是「平穩」的關鍵
  const tryX = player.position.x + stepX;
  if (!collidesAt(currentMapName, tryX, player.position.z)) player.position.x = tryX;
  const tryZ = player.position.z + stepZ;
  if (!collidesAt(currentMapName, player.position.x, tryZ)) player.position.z = tryZ;

  if (isMoving) {
    // 角色模型的鼻子／腮紅在本地 -Z 面，因此移動方向要比「+Z 為正面」
    // 的通用公式多轉半圈；否則臉會永遠朝向來時路。
    const targetAngle = Math.atan2(dx, dz) + Math.PI;
    player.rotation.y += ((targetAngle - player.rotation.y + Math.PI * 3) % (Math.PI * 2) - Math.PI) * 0.35;
    facing = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'right' : 'left') : (dz > 0 ? 'down' : 'up');
  }
  animateWalk(player, isMoving, elapsed);
  if (currentMapName === 'outside') player.position.y += groundY(player.position.x);

  // 拋竿/持竿動畫：雙手一起蓋過 animateWalk 剛設好的角度。左手往內、往前
  // 擺，靠到跟右手（拿竿那手）差不多的位置跟角度，用兩隻手臂同一個朝向
  // 湊出「雙手握竿」的視覺，不用真的把竿子綁定在兩個支點上
  if (elapsed < castAnimEnd) {
    const progress = 1 - (castAnimEnd - elapsed) / CAST_ANIM_DURATION;
    // 先向後（+Z）短暫蓄力，再加速往角色正面（-Z）甩出，最後銜接持竿姿勢。
    const castPose = progress < 0.32
      ? -0.85 * Math.sin((progress / 0.32) * Math.PI / 2)
      : -0.85 + 2.0 * (1 - Math.pow(1 - (progress - 0.32) / 0.68, 3));
    player.parts.armR.rotation.x = castPose;
    player.parts.armR.rotation.z = 0;
    player.parts.armL.rotation.x = castPose * 0.91;
    player.parts.armL.rotation.z = 0.45;
  } else if (fishingState !== 'idle' && player.parts.rod && player.parts.rod.visible) {
    // 拋竿動畫結束後，站著等魚上鉤時雙手固定在持竿姿勢，不要被待機呼吸動畫拉回去
    player.parts.armR.rotation.x = 1.15; player.parts.armR.rotation.z = 0;
    player.parts.armL.rotation.x = 1.05; player.parts.armL.rotation.z = 0.45;
  } else {
    player.parts.armL.rotation.z = 0; // 沒在釣魚時把左手歸零，不然會卡在往內擺的角度
  }

  // 釣到魚的小動畫：魚從浮標的位置，沿著拋物線飛向玩家，邊飛邊轉，
  // 飛到定點就消失——「消失」代表放進魚簍了，不需要額外的收納動畫
  if (catchAnim) {
    const t = (elapsed - catchAnim.start) / catchAnim.duration;
    if (t >= 1) {
      scene.remove(catchAnim.mesh);
      catchAnim = null;
    } else {
      const toX = player.position.x, toZ = player.position.z, toY = 0.9;
      const x = catchAnim.from.x + (toX - catchAnim.from.x) * t;
      const z = catchAnim.from.z + (toZ - catchAnim.from.z) * t;
      const y = catchAnim.from.y + (toY - catchAnim.from.y) * t + Math.sin(t * Math.PI) * 0.85;
      catchAnim.mesh.position.set(x, y, z);
      catchAnim.mesh.rotation.y = elapsed * 11;
      catchAnim.mesh.rotation.z = elapsed * 7;
      catchAnim.mesh.scale.setScalar(1.7 * (1 - t * 0.5));
    }
  }

  // --- 釣魚狀態機推進：casting 計時到了就進 biting，biting 逾時沒按 E 就跑掉 ---
  const fishHintEl = window.__fishHintEl || (window.__fishHintEl = document.getElementById('fishHint'));
  if (!nearWater() && fishingState !== 'idle') {
    // 走離水邊自動取消，不用特別按什麼鍵收竿
    fishingState = 'idle';
    if (bobberMesh) { scene.remove(bobberMesh); bobberMesh = null; }
    if (player.parts.rod) player.parts.rod.visible = false;
  }
  if (fishingState === 'casting') {
    fishingTimer += dt;
    if (fishingTimer >= biteWaitTime) {
      fishingState = 'biting';
      biteWindowStart = elapsed;
    }
  } else if (fishingState === 'biting') {
    if (elapsed - biteWindowStart > 1.1) {
      fishingState = 'idle';
      if (bobberMesh) { scene.remove(bobberMesh); bobberMesh = null; }
      if (player.parts.rod) player.parts.rod.visible = false;
      fishFeedback = { text: '牠跑掉了……', until: elapsed + 1.2 };
    }
  }
  if (bobberMesh) {
    // 玩家模型正面是本地 -Z；浮標必須沿真正的臉朝向拋出。
    const forwardX = -Math.sin(player.rotation.y), forwardZ = -Math.cos(player.rotation.y);
    bobberMesh.position.set(
      player.position.x + forwardX * 0.85,
      0.16 + (fishingState === 'biting' ? Math.abs(Math.sin(elapsed * 14)) * 0.05 : Math.sin(elapsed * 2) * 0.015),
      player.position.z + forwardZ * 0.85
    );
  }
  if (fishFeedback && elapsed > fishFeedback.until) fishFeedback = null;
  if (fishFeedback) {
    fishHintEl.textContent = fishFeedback.text;
    fishHintEl.style.display = 'block';
  } else if (fishingState === 'casting') {
    fishHintEl.textContent = '拋竿中……';
    fishHintEl.style.display = 'block';
  } else if (fishingState === 'biting') {
    fishHintEl.textContent = '上鉤了！快按 E！';
    fishHintEl.style.display = 'block';
  } else {
    fishHintEl.style.display = 'none';
  }

  // 格子座標現在只是「玩家四捨五入後大概在哪一格」，給種田/撿種子/開門這些
  // 本來就是格子概念的系統用，跟移動本身脫鉤
  const roundedX = Math.round(player.position.x), roundedZ = Math.round(player.position.z);
  if (roundedX !== playerGridPos.x || roundedZ !== playerGridPos.z) {
    playerGridPos = { x: roundedX, z: roundedZ };
    events
      .filter(ev => ev.map === currentMapName && ev.trigger === 'touch')
      .filter(ev => ev.x === roundedX && ev.z === roundedZ)
      .forEach(ev => ev.action());
  }

  const phase = (elapsed % dayLength) / dayLength;
  currentPhase = phase;
  currentDay = Math.floor(elapsed / dayLength);
  if (currentDay !== prevDay) {
    prevDay = currentDay;
    beginNewDay(currentDay);
    growCropsForNewDay();
    syncFarmVisuals();
  }

  // --- NPC：先看行程表要去哪，再用 A* 決定「怎麼走」 ---
  const npcSpeed = 1.6;
  npcs.forEach(n => {
    const target = getScheduleTarget(n.schedule, phase);
    const targetKey = `${target.x},${target.z}`;

    if (n.lastTargetKey !== targetKey) {
      n.lastTargetKey = targetKey;
      const startGrid = { x: Math.round(n.mesh.position.x), z: Math.round(n.mesh.position.z) };
      const path = aStar(startGrid, target, outsideCols, outsideRows, (x, z) => isBlocked('outside', x, z));
      n.path = path && path.length ? path : [target]; // 找不到路就退回直線，至少不會卡死
      n.pathIndex = (n.path[0] && n.path[0].x === startGrid.x && n.path[0].z === startGrid.z) ? 1 : 0;
    }

    let moving = false;
    if (n.path && n.pathIndex < n.path.length) {
      const wp = n.path[n.pathIndex];
      const dx = wp.x - n.mesh.position.x, dz = wp.z - n.mesh.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist > 0.06) {
        moving = true;
        const step = Math.min(dist, npcSpeed * dt);
        n.mesh.position.x += (dx / dist) * step;
        n.mesh.position.z += (dz / dist) * step;
        // NPC 與玩家使用同一種人形模型，正面同樣朝本地 -Z。
        n.mesh.rotation.y = Math.atan2(dx, dz) + Math.PI;
      } else {
        n.pathIndex++;
      }
    }
    if (!moving && currentMapName === 'outside') {
      const pdx = player.position.x - n.mesh.position.x, pdz = player.position.z - n.mesh.position.z;
      if (Math.sqrt(pdx * pdx + pdz * pdz) <= 4) {
        const targetAngle = Math.atan2(pdx, pdz) + Math.PI;
        n.mesh.rotation.y += ((targetAngle - n.mesh.rotation.y + Math.PI * 3) % (Math.PI * 2) - Math.PI) * 0.05;
      }
    }
    animateWalk(n.mesh, moving, elapsed);
  });

  // 午夜最黑、中午最亮；先前使用 1 - cos 會讓 00:00 與 12:00 顛倒。
  const nightFactor = (1 + Math.cos(phase * Math.PI * 2)) / 2;
  window.__nightFactor = nightFactor;
  updateMusic(nightFactor, dt);
  updateSkyDome(nightFactor);
  updateWeatherEffects(dt, nightFactor);

  // --- 動物固定作息：06:00 出門，18:00 開始回穀倉 ---
  // 不使用 nightFactor 判斷，因為它是光線漸變值，不等於準確鐘點。
  const gameHour = phase * 24;
  const animalsShouldBeHome = gameHour < 6 || gameHour >= 18;
  animals.forEach(a => {
    let moving = false;
    if (animalsShouldBeHome) {
      if (a.state === 'out') {
        // 18:00 後不管原本是否正在休息，都立即往穀倉移動。
        a.wanderState = 'walking';
        const dx = BARN_DOOR.x - a.mesh.position.x, dz = BARN_DOOR.z - a.mesh.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist > 0.12) {
          moving = true;
          const step = Math.min(dist, a.speed * dt);
          a.mesh.position.x += (dx / dist) * step;
          a.mesh.position.z += (dz / dist) * step;
          // 動物模型的頭朝本地 +X，不是跟角色一樣朝 -Z，所以要多轉 -90°，
          // 跟魚的朝向公式是同一個修正（見上面 fishSchool 那段）
          a.mesh.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
        } else {
          a.state = 'in';
          a.mesh.visible = false;
        }
      }
    } else if (a.state === 'in') {
      a.state = 'out';
      a.mesh.visible = true;
      a.mesh.position.set(BARN_DOOR.x, 0, BARN_DOOR.z);
      a.target = chooseAnimalPastureTarget(a);
      a.wanderState = 'walking';
      a.restUntil = 0;
      a.grazeAt = Infinity;
    } else {
      // 白天不再不停巡邏：抵達目標後先休息，再挑下一個位置。
      if (a.wanderState === 'resting') {
        if (elapsed >= a.restUntil) {
          a.wanderState = 'walking';
          a.target = chooseAnimalPastureTarget(a);
          a.grazeAt = Infinity;
        } else if (elapsed >= a.grazeAt) {
          tryEatPastureGrass(a);
          a.grazeAt = Infinity;
        }
      } else {
        const dx = a.target.x - a.mesh.position.x, dz = a.target.z - a.mesh.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.15) {
          a.wanderState = 'resting';
          a.restUntil = elapsed + a.restMin + Math.random() * (a.restMax - a.restMin);
          a.grazeAt = elapsed + 0.8;
        } else {
          moving = true;
          const step = Math.min(dist, a.speed * dt);
          a.mesh.position.x += (dx / dist) * step;
          a.mesh.position.z += (dz / dist) * step;
          a.mesh.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
        }
      }
    }
    animateAnimalWalk(a, moving, elapsed);
  });

  const sky = DAY.sky.clone().lerp(NIGHT.sky, nightFactor);
  const weatherDim = { cloudy: 0.28, rain: 0.38, typhoon: 0.55, storm: 0.62, snow: 0.16, blizzard: 0.46 }[currentWeather] || 0;
  const weatherFogColor = currentWeather === 'snow' || currentWeather === 'blizzard'
    ? new THREE.Color(0xcbd4dc) : new THREE.Color(0x697685);
  sky.lerp(weatherFogColor, weatherDim);
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, 16 - weatherDim * 5, 34 - weatherDim * 11);
  ambient.intensity = (DAY.ambient + (NIGHT.ambient - DAY.ambient) * nightFactor) * (1 - weatherDim * 0.32);
  sun.intensity = (DAY.sunIntensity + (NIGHT.sunIntensity - DAY.sunIntensity) * nightFactor) * (1 - weatherDim * 0.72);
  sun.color.copy(DAY.sunColor).lerp(NIGHT.sunColor, nightFactor);
  windowMats.forEach(m => { m.emissiveIntensity = nightFactor; });
  outdoorLampLights.forEach(light => { light.intensity = nightFactor * 1.35; });
  if (houseLampLight) {
    houseLampBulbMat.emissiveIntensity = nightFactor;
    houseLampLight.intensity = nightFactor * 1.6;
  }

  const camDist = 16;
  const camHeight = camDist * Math.cos(TILT_RAD);
  const camZOffset = camDist * Math.sin(TILT_RAD);
  const groundOffset = currentMapName === 'outside' ? groundY(player.position.x) : 0;
  camera.position.set(player.position.x, camHeight + groundOffset, player.position.z + camZOffset);
  camera.lookAt(player.position.x, groundOffset, player.position.z);

  // 海浪：仿 Gerstner 波浪——頂點升高的同時往岸邊(-X)推移，波峰因此變陡、
  // 波谷變平緩，看起來像浪頭在往前捲；捲到最高點時把該處頂點染白模擬碎浪
  if (oceanMesh && updateWaterSurface) {
    const posAttr = oceanMesh.geometry.attributes.position;
    const colorAttr = oceanMesh.geometry.attributes.color;
    const basePos = oceanMesh.geometry.userData.basePositions;
    const ox = oceanMesh.position.x, oz = oceanMesh.position.z;
    const waveSpeed = 2.2, waveNum = 1.4, waveHeight = 0.09, steepness = 0.55;
    for (let i = 0; i < posAttr.count; i++) {
      const bx = basePos[i * 3], bz = basePos[i * 3 + 2];
      const worldX = bx + ox, worldZ = bz + oz;
      // 用 +elapsed（不是 -elapsed）相位才會隨時間往 -X 移動——沙灘就在海的
      // 左邊（x 較小），這樣浪才是「滾向沙灘」而不是詭異地滾回外海
      const phase = worldX * waveNum + elapsed * waveSpeed + Math.sin(worldZ * 0.8) * 0.5;
      const sinP = Math.sin(phase), cosP = Math.cos(phase);

      const waveY = sinP * waveHeight + Math.cos(worldZ * 1.2 + elapsed) * 0.015;
      const displacementX = cosP * waveHeight * steepness;
      posAttr.setX(i, bx - displacementX);
      posAttr.setY(i, waveY);

      // 浪頭捲到接近最高點時快速染白，模擬碎浪；其餘地方維持海藍色
      const crestFactor = Math.max(0, (sinP - 0.4) / 0.6);
      const t = Math.pow(crestFactor, 1.8);
      colorAttr.setXYZ(i, 0.18 + 0.82 * t, 0.43 + 0.57 * t, 0.68 + 0.32 * t);
    }
    posAttr.needsUpdate = true;
    colorAttr.needsUpdate = true;
    if (animationFrameCount % 8 === 0) oceanMesh.geometry.computeVertexNormals();
  }
  // 湖的波紋——幅度只有海的十分之一左右，沒有碎浪、沒有顏色變化，
  // 純粹是輕輕晃動的水面，配上平滑法線去接收陽光的反光高光
  if (lakeMesh && updateWaterSurface) {
    const lPosAttr = lakeMesh.geometry.attributes.position;
    const lBase = lakeMesh.geometry.userData.basePositions;
    const llx = lakeMesh.position.x, llz = lakeMesh.position.z;
    for (let i = 0; i < lPosAttr.count; i++) {
      const bx = lBase[i * 3], bz = lBase[i * 3 + 2];
      const wx = bx + llx, wz = bz + llz;
      const y = Math.sin(wx * 2.4 + elapsed * 1.1) * 0.011 + Math.cos(wz * 2.0 + elapsed * 0.85) * 0.009;
      lPosAttr.setY(i, y);
    }
    lPosAttr.needsUpdate = true;
    if (animationFrameCount % 8 === 0) lakeMesh.geometry.computeVertexNormals();
  }
  // 北海以短波呈現；靠右側逐漸混合成東海的浪形，轉角不會出現動畫斷層。
  if (seaGlimpseMesh && updateWaterSurface) {
    const sgPosAttr = seaGlimpseMesh.geometry.attributes.position;
    const sgBase = seaGlimpseMesh.geometry.userData.basePositions;
    for (let i = 0; i < sgPosAttr.count; i++) {
      const bx = sgBase[i * 3], bz = sgBase[i * 3 + 2];
      const worldX = bx + seaGlimpseMesh.position.x;
      const worldZ = bz + seaGlimpseMesh.position.z;
      const northWave = Math.sin(worldZ * 1.65 + elapsed * 1.25 + Math.sin(worldX * 0.28) * 0.55) * 0.045
        + Math.cos(worldX * 0.72 - elapsed * 0.8) * 0.018;
      const eastPhase = worldX * 1.4 + elapsed * 2.2 + Math.sin(worldZ * 0.8) * 0.5;
      const eastWave = Math.sin(eastPhase) * 0.09 + Math.cos(worldZ * 1.2 + elapsed) * 0.015;
      const mixRaw = Math.max(0, Math.min(1,
        (worldX - (LAYOUT.coast.rampX - 2)) / 7));
      const mix = mixRaw * mixRaw * (3 - 2 * mixRaw);
      const y = northWave + (eastWave - northWave) * mix;
      sgPosAttr.setY(i, y);
    }
    sgPosAttr.needsUpdate = true;
    if (animationFrameCount % 8 === 0) seaGlimpseMesh.geometry.computeVertexNormals();
  }
  // 拍岸浪花：浪頭衝上岸時放大、變亮、泡沫顆粒跟著滾動碎裂；退潮時很快收回去
  foamMeshes.forEach(f => {
    const phase = elapsed * 2.2 + f.userData.seed;
    const cycle = (Math.sin(phase) + 1) / 2; // 0~1，一波一波衝上岸又退回去
    f.position.x = f.userData.baseX + (-0.18 + cycle * 0.32);
    const impact = Math.pow(cycle, 1.5);
    f.userData.crest.material.opacity = impact * 0.85;
    f.userData.crest.scale.set(1 + impact * 0.2, 0.6 + impact * 0.8, 1);
    f.userData.wash.material.opacity = (1 - cycle) * 0.35;
    f.userData.wash.scale.set(0.8 + cycle * 0.5, 1, 1);
    f.userData.bumps.forEach((b, i) => {
      const bp = phase * 1.3 + i * 0.7;
      const bumpScale = Math.max(0.01, Math.sin(bp));
      b.scale.set(bumpScale, bumpScale * (0.3 + impact * 0.5), bumpScale);
      b.rotation.z = elapsed * 3 + i; // 滾動感
      b.material.opacity = impact * 0.8;
    });
  });

  // 真魚通常會直線巡游一段、短暫停留，再改成橫向或縱向的新路線；
  // 路線只加一點側向弧度，方向與停留時間每段都不同。
  fishSchool.forEach(f => {
    if (!f.route && elapsed >= f.pauseUntil) startFishRoute(f, elapsed);
    if (!f.route) {
      f.mesh.position.y = f.baseY + Math.sin(elapsed * 0.8 + f.phase) * f.depthAmp * 0.35;
      return;
    }
    const progress = Math.min(1, (elapsed - f.route.start) / f.route.duration);
    const sideCurve = Math.sin(progress * Math.PI) * f.route.curve;
    const nx = f.route.fromX + (f.route.toX - f.route.fromX) * progress
      + (f.route.horizontal ? 0 : sideCurve);
    const nz = f.route.fromZ + (f.route.toZ - f.route.fromZ) * progress
      + (f.route.horizontal ? sideCurve : 0);
    const dx = nx - f.mesh.position.x, dz = nz - f.mesh.position.z;
    if (Math.abs(dx) > 1e-5 || Math.abs(dz) > 1e-5) {
      const targetAngle = Math.atan2(dx, dz) - Math.PI / 2;
      f.mesh.rotation.y += ((targetAngle - f.mesh.rotation.y + Math.PI * 3) % (Math.PI * 2) - Math.PI) * 0.09;
    }
    f.mesh.position.x = nx;
    f.mesh.position.z = nz;
    f.mesh.position.y = f.baseY + Math.sin(elapsed * 0.75 + f.phase) * f.depthAmp;
    if (progress >= 1) {
      f.route = null;
      // 約七成路段結束後會停 0.7～3.2 秒，其餘直接接下一段。
      f.pauseUntil = elapsed + (Math.random() < 0.7 ? 0.7 + Math.random() * 2.5 : 0);
    }
  });

  // 牧草會依序長成短、中、長三階段；長草被牛羊吃掉後回到短草。
  // 風擺施加在葉片底部的 pivot，草根因此會固定在地面。
  grassAnimationAccumulator += dt;
  if (grassAnimationAccumulator >= 1 / 20) {
    const grassDt = grassAnimationAccumulator;
    grassAnimationAccumulator = 0;
    const windSpeed = 2.15;
    pastureGrassBlades.forEach(tuft => {
    const wx = tuft.position.x, wz = tuft.position.z;
    tuft.userData.growth = Math.min(3, tuft.userData.growth + grassDt / GRASS_GROWTH_SECONDS);
    setPastureGrassStage(tuft, Math.floor(tuft.userData.growth));
    const sway = 0.16 + tuft.userData.stage * 0.09;
    const playerDistance = currentMapName === 'outside'
      ? Math.hypot(wx - player.position.x, wz - player.position.z) : Infinity;
    const wake = isMoving && playerDistance < 1.05 ? (1 - playerDistance / 1.05) * 0.52 : 0;
    const wakeX = playerDistance > 0.001 ? (wx - player.position.x) / playerDistance * wake : 0;
    const wakeZ = playerDistance > 0.001 ? (wz - player.position.z) / playerDistance * wake : 0;
    tuft.userData.blades.forEach(pivot => {
      const wave = elapsed * windSpeed + pivot.userData.phase + wx * 0.72 + wz * 0.28;
      pivot.rotation.z = pivot.userData.baseRotZ + Math.sin(wave) * sway - wakeX;
      pivot.rotation.x = pivot.userData.baseRotX + Math.sin(wave * 0.82 + 1.4) * sway * 0.45 + wakeZ;
    });
    });
  }

  hudUpdateAccumulator += dt;
  if (hudUpdateAccumulator >= 0.2) {
    hudUpdateAccumulator = 0;
    updateHud();
  }
  renderer.render(scene, camera);
}

buildMap('outside');
loadMap('outside');
fadeIn();
requestAnimationFrame(animate);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  updateCameraFrustum();
});
</script>
</body>
</html>
