<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="256x256"
      href="/favicon.ico?v=20260820"
    />
    <title>海風牧歌 Meadowtide</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="ui">
      <b>海風牧歌</b><br />
      WASD：移動 ・ 滾輪：縮放 ・ E：互動/種植/收成/釣魚 ・ M：音樂靜音<br />
      F6：存檔 ・ F9：讀檔<br />
      <b style="color: #8ecfff">N：快轉時間</b>
    </div>
    <div id="hud"></div>
    <div id="inventoryOverlay" aria-hidden="true" data-game-menu="closed">
      <section id="inventoryPanel" role="dialog" aria-modal="true" aria-label="背包">
        <header class="inventory-header">
          <div id="inventoryTabs" role="tablist" aria-label="背包分頁">
            <button class="inventory-tab active" type="button" role="tab" aria-selected="true" data-inventory-tab="bag">背包</button>
            <button class="inventory-tab" type="button" role="tab" aria-selected="false" data-inventory-tab="materials" tabindex="-1">素材</button>
            <button class="inventory-tab" type="button" role="tab" aria-selected="false" data-inventory-tab="cooking" tabindex="-1">料理</button>
          </div>
          <button id="inventoryClose" type="button" aria-label="關閉背包">Q / Y　關閉</button>
        </header>
        <div id="inventoryGrid"></div>
        <footer class="inventory-footer">← →／手把 LB RB 切換分頁　・　Q／Y 關閉</footer>
      </section>
    </div>
    <div id="fade"></div>
    <div id="cgOverlay"><img id="cgImg" alt="" /></div>
    <div id="dialog">
      <div id="dialogName"></div>
      <img id="dialogPortrait" alt="" />
      <div id="dialogPortraitPlaceholder"></div>
      <div id="dialogText"></div>
      <div id="dialogContinue">按 E 繼續 ▾</div>
    </div>
    <!-- 選項面板獨立在 #dialog 外面(不是內部子元素)：#dialog 有 transform，
         會讓內部 position:fixed 子元素的定位基準變成 #dialog 的 box 而不是
         viewport，搬出來才能單純用 JS 算「貼在對話框正上方」的絕對位置
         (見 dialogue.ts 的 positionChoicePanel)。 -->
    <div id="dialogChoices"></div>
    <div id="fishHint"></div>
    <!-- 釣魚 QTE 浮動提示：跟在主角頭頂正上方，每幀由 game-loop.ts 用
         .project(camera) 算螢幕座標更新 left/top(見 style.css #fishActionHud
         註解)。只在 biting/reeling(要馬上按鍵)這兩個狀態顯示，取代原本
         #fishHint 的整句文字提示。 -->
    <div id="fishActionHud">
      <div id="fishStaminaBar"><div id="fishStaminaFill"></div></div>
      <div id="fishActionKey"></div>
    </div>
    <div id="harvestToast">
      <div id="harvestToastIcon">
        <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <defs>
            <radialGradient id="harvestPearlGrad" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fffaf0" />
              <stop offset="55%" stop-color="#f5d98a" />
              <stop offset="100%" stop-color="#c9a355" />
            </radialGradient>
            <linearGradient id="harvestShellGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4ead9" />
              <stop offset="100%" stop-color="#c7ac82" />
            </linearGradient>
          </defs>
          <path
            d="M24 41 C7 41 3 26 5.5 17 C10.5 19.5 16.5 22 24 22 C31.5 22 37.5 19.5 42.5 17 C45 26 41 41 24 41 Z"
            fill="url(#harvestShellGrad)"
            stroke="#8a7452"
            stroke-width="1.2"
          />
          <path
            d="M24 22 C20 22.5 16 22 11.5 20 M24 22 C28 22.5 32 22 36.5 20 M24 22 C22.5 27 22 33 22.5 38 M24 22 C25.5 27 26 33 25.5 38"
            fill="none"
            stroke="#8a7452"
            stroke-width="1"
            opacity="0.55"
          />
          <circle
            cx="24"
            cy="15"
            r="7.5"
            fill="url(#harvestPearlGrad)"
            stroke="#e8c877"
            stroke-width="1"
          />
        </svg>
      </div>
      <div id="harvestToastBody">
        <div id="harvestToastTitle"></div>
        <div id="harvestToastText"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
