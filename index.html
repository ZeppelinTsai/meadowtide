<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="256x256"
      href="/favicon.ico?v=20260820"
    />
    <title>海風牧歌 Meadowtide</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="ui">
      <b>海風牧歌</b><br />
      WASD：移動 ・ 滾輪：縮放 ・ E：互動/種植/收成/釣魚 ・ M：音樂靜音<br />
      Q：資訊選單 ・ Esc：暫停選單 ・ Shift+1~9：存檔 ・ 1~9：讀檔<br />
      <b style="color: #8ecfff">N：快轉時間</b>
    </div>
    <div id="hud"></div>
    <div id="inventoryOverlay" aria-hidden="true" data-game-menu="closed">
      <section
        id="inventoryPanel"
        role="dialog"
        aria-modal="true"
        aria-label="資訊選單"
      >
        <header class="inventory-header">
          <span class="inventory-menu-label">資訊選單</span>
          <div id="inventoryTabs" role="tablist" aria-label="資訊選單分頁">
            <button
              class="inventory-tab active"
              type="button"
              role="tab"
              aria-selected="true"
              data-inventory-tab="bag"
            >
              物品
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="materials"
              tabindex="-1"
            >
              素材
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="cooking"
              tabindex="-1"
            >
              料理
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="relationships"
              tabindex="-1"
            >
              關係
            </button>
          </div>
          <button id="inventoryClose" type="button" aria-label="關閉資訊選單">
            Q / Y　關閉
          </button>
        </header>
        <div id="inventoryGrid"></div>
        <footer class="inventory-footer">
          ← →／手把 LB RB 切換分頁　・　Q／Y 關閉
        </footer>
      </section>
    </div>
    <div id="pauseMenu" aria-hidden="true" data-game-menu="closed" data-step="menu">
      <section
        id="pauseMenuPanel"
        class="pauseStep"
        role="dialog"
        aria-modal="true"
        aria-label="暫停選單"
      >
        <h2 id="pauseMenuHeading">海風牧歌</h2>
        <nav id="pauseMenuButtons">
          <button type="button" id="pauseResumeBtn" class="titleMenuBtn">
            返回畫面
          </button>
          <button type="button" id="pauseLoadBtn" class="titleMenuBtn">
            讀取進度
          </button>
          <button type="button" id="pauseTutorialBtn" class="titleMenuBtn">
            玩法教學
          </button>
          <button type="button" id="pauseSystemBtn" class="titleMenuBtn">
            系統
          </button>
          <button type="button" id="pauseQuitBtn" class="titleMenuBtn">
            結束遊戲
          </button>
        </nav>
        <p id="pauseQuitMessage" hidden>
          感謝遊玩《海風牧歌》，可以安全關閉這個分頁了。
        </p>
      </section>
      <section id="pauseLoadSlotsPanel" class="pauseStep">
        <h2 id="pauseLoadSlotsHeading">讀取進度</h2>
        <div id="pauseLoadSlotsList"></div>
        <button type="button" id="pauseLoadSlotsBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseSystemPanel" class="pauseStep">
        <h2 id="pauseSystemHeading">系統</h2>
        <button type="button" id="pauseMuteBtn" class="titleMenuBtn"></button>
        <button type="button" id="pauseSystemBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseTutorialPanel" class="pauseStep pauseTutorialStep">
        <h2>玩法教學</h2>
        <p class="pauseTutorialLead">選擇想查看的項目</p>
        <div class="pauseTutorialList">
          <button type="button" class="pauseTutorialTopic" data-tutorial-topic="walking">
            <span class="pauseTutorialTopicNumber">01</span>
            <span><strong>行走</strong><small>移動、奔跑與視角操作</small></span>
            <span aria-hidden="true">›</span>
          </button>
        </div>
        <button type="button" id="pauseTutorialBackBtn" class="titleMenuBtn">返回</button>
      </section>
      <section id="pauseTutorialCardsPanel" class="pauseStep pauseTutorialStep">
        <header class="pauseTutorialCardsHeader">
          <button type="button" id="pauseTutorialCardsBackBtn" class="pauseTutorialIconBtn" aria-label="返回教學清單">‹</button>
          <div><span class="pauseTutorialEyebrow">玩法教學</span><h2>行走</h2></div>
          <span id="pauseTutorialPageNumber" class="pauseTutorialPageNumber">1 / 3</span>
        </header>
        <div id="pauseTutorialCarousel" class="pauseTutorialCarousel" tabindex="0">
          <button type="button" id="pauseTutorialPrevBtn" class="pauseTutorialArrow" aria-label="上一頁">‹</button>
          <article class="pauseTutorialCard" aria-live="polite">
            <div class="pauseTutorialShot"><img id="pauseTutorialImage" alt="" /><div id="pauseTutorialImageFallback" class="pauseTutorialImageFallback">遊戲截圖預留位置</div></div>
            <div class="pauseTutorialCopy"><span id="pauseTutorialCardKicker"></span><h3 id="pauseTutorialCardTitle"></h3><p id="pauseTutorialCardText"></p><div id="pauseTutorialKeys" class="pauseTutorialKeys"></div></div>
          </article>
          <button type="button" id="pauseTutorialNextBtn" class="pauseTutorialArrow" aria-label="下一頁">›</button>
        </div>
        <div id="pauseTutorialDots" class="pauseTutorialDots"></div>
        <p class="pauseTutorialHint">滾輪／← → 切換頁面</p>
      </section>
    </div>
    <div id="fade"></div>
    <div id="cgOverlay"><img id="cgImg" alt="" /></div>
    <div id="dialog">
      <div id="dialogName"></div>
      <img id="dialogPortrait" alt="" />
      <div id="dialogPortraitPlaceholder"></div>
      <div id="dialogText"></div>
      <div id="dialogContinue">按 E 繼續 ▾</div>
    </div>
    <!-- 選項面板獨立在 #dialog 外面(不是內部子元素)：#dialog 有 transform，
         會讓內部 position:fixed 子元素的定位基準變成 #dialog 的 box 而不是
         viewport，搬出來才能單純用 JS 算「貼在對話框正上方」的絕對位置
         (見 dialogue.ts 的 positionChoicePanel)。 -->
    <div id="dialogChoices"></div>
    <div id="fishHint"></div>
    <!-- 釣魚 QTE 浮動提示：跟在主角頭頂正上方，每幀由 game-loop.ts 用
         .project(camera) 算螢幕座標更新 left/top(見 style.css #fishActionHud
         註解)。只在 biting/reeling(要馬上按鍵)這兩個狀態顯示，取代原本
         #fishHint 的整句文字提示。 -->
    <div id="fishActionHud">
      <div id="fishActionKey"></div>
    </div>
    <div id="harvestToast">
      <div id="harvestToastIcon">
        <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <defs>
            <radialGradient id="harvestPearlGrad" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fffaf0" />
              <stop offset="55%" stop-color="#f5d98a" />
              <stop offset="100%" stop-color="#c9a355" />
            </radialGradient>
            <linearGradient id="harvestShellGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4ead9" />
              <stop offset="100%" stop-color="#c7ac82" />
            </linearGradient>
          </defs>
          <path
            d="M24 41 C7 41 3 26 5.5 17 C10.5 19.5 16.5 22 24 22 C31.5 22 37.5 19.5 42.5 17 C45 26 41 41 24 41 Z"
            fill="url(#harvestShellGrad)"
            stroke="#8a7452"
            stroke-width="1.2"
          />
          <path
            d="M24 22 C20 22.5 16 22 11.5 20 M24 22 C28 22.5 32 22 36.5 20 M24 22 C22.5 27 22 33 22.5 38 M24 22 C25.5 27 26 33 25.5 38"
            fill="none"
            stroke="#8a7452"
            stroke-width="1"
            opacity="0.55"
          />
          <circle
            cx="24"
            cy="15"
            r="7.5"
            fill="url(#harvestPearlGrad)"
            stroke="#e8c877"
            stroke-width="1"
          />
        </svg>
      </div>
      <div id="harvestToastBody">
        <div id="harvestToastTitle"></div>
        <div id="harvestToastText"></div>
      </div>
    </div>
    <!-- 開局標題畫面：先「按任意鍵」拿到一次真正的使用者手勢(順便解決
         BGM 自動播放政策擋掉的問題，見 music.ts/title-screen.ts 的說明)，
         再進主選單。純白底、不吃任何圖片素材，z-index 特意開最高(100)，
         蓋過 #fade(20)/#dialog(15) 等既有疊層。 -->
    <div id="titleScreen" data-step="splash">
      <div id="titleSplash" class="titleStep">
        <h1 id="titleLogo">海風牧歌</h1>
        <p id="titleSubtitle">Meadowtide</p>
        <p id="titlePrompt">按任意鍵開始</p>
      </div>
      <div id="titleMenu" class="titleStep">
        <h1 id="titleMenuLogo">海風牧歌</h1>
        <nav id="titleMenuButtons">
          <button type="button" id="titleNewGameBtn" class="titleMenuBtn">
            開始新遊戲
          </button>
          <button
            type="button"
            id="titleContinueBtn"
            class="titleMenuBtn"
            hidden
          >
            繼續遊戲
          </button>
          <button type="button" id="titleSystemBtn" class="titleMenuBtn">
            系統
          </button>
          <button type="button" id="titleQuitBtn" class="titleMenuBtn">
            結束遊戲
          </button>
        </nav>
        <p id="titleQuitMessage" hidden>
          感謝遊玩《海風牧歌》，可以安全關閉這個分頁了。
        </p>
      </div>
      <div id="titleSystem" class="titleStep">
        <h2 id="titleSystemHeading">系統</h2>
        <button type="button" id="titleMuteBtn" class="titleMenuBtn"></button>
        <button type="button" id="titleSystemBackBtn" class="titleMenuBtn">
          返回
        </button>
      </div>
      <div id="titleLoadSlots" class="titleStep">
        <h2 id="titleLoadSlotsHeading">選擇存檔</h2>
        <div id="titleLoadSlotsList"></div>
        <button type="button" id="titleLoadSlotsBackBtn" class="titleMenuBtn">
          返回
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
