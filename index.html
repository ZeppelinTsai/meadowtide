<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="256x256"
      href="/favicon.ico?v=20260820"
    />
    <title>海風牧歌 Meadowtide</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="title-presentation">
    <div id="loadingScreen" class="loadingScreen" aria-hidden="true"></div>
    <div id="ui">
      <button
        id="quickMapMenuBtn"
        class="quickMenuBtn"
        type="button"
        aria-keyshortcuts="M"
      >
        <span class="quickMenuLabel">
          <svg
            class="quickMenuIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M3 5.5 8.5 3l7 2.5L21 3v15.5L15.5 21l-7-2.5L3 21Z"
              fill="#f2d08c"
              stroke="#493025"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M8.5 3v15.5M15.5 5.5V21"
              fill="none"
              stroke="#493025"
              stroke-width="1.5"
            />
          </svg>
          <span>地圖</span>
        </span>
        <small>M／Select</small>
      </button>
      <button
        id="quickInfoMenuBtn"
        class="quickMenuBtn"
        type="button"
        aria-keyshortcuts="Q"
      >
        <span class="quickMenuLabel">
          <svg
            class="quickMenuIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M6 3h12v15.5A2.5 2.5 0 0 1 15.5 21H7.75A2.75 2.75 0 0 1 5 18.25V4a1 1 0 0 1 1-1Z"
              fill="#f2d08c"
              stroke="#493025"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M8.5 7h7M8.5 11h7M8.5 15h4.5M5 18.25c0-1.1.9-2 2-2h11"
              fill="none"
              stroke="#493025"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span>資訊</span>
        </span>
        <small>Q／Y</small>
      </button>
      <button
        id="quickPauseMenuBtn"
        class="quickMenuBtn"
        type="button"
        aria-keyshortcuts="Escape"
      >
        <span class="quickMenuLabel">
          <svg
            class="quickMenuIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <rect
              x="3"
              y="4"
              width="18"
              height="16"
              rx="3"
              fill="#f2d08c"
              stroke="#493025"
              stroke-width="1.5"
            />
            <path
              d="M7 8h10M7 12h10M7 16h10"
              fill="none"
              stroke="#493025"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span>選單</span>
        </span>
        <small>Esc／Start</small>
      </button>
    </div>
    <div id="hud" aria-label="日期與天氣">
      <div id="hudDate" class="hud-date"></div>
      <div id="hudTime" class="hud-time"></div>
      <div id="hudWeatherRow" class="hud-weather-row">
        <div class="hud-weather-day" data-offset="0">
          <span class="hud-weather-emoji"></span>
          <span class="hud-weather-label"></span>
          <span class="hud-weather-when">今天</span>
        </div>
        <div class="hud-weather-day" data-offset="1">
          <span class="hud-weather-emoji"></span>
          <span class="hud-weather-label"></span>
          <span class="hud-weather-when">明天</span>
        </div>
        <div class="hud-weather-day" data-offset="2">
          <span class="hud-weather-emoji"></span>
          <span class="hud-weather-label"></span>
          <span class="hud-weather-when">後天</span>
        </div>
      </div>
    </div>
    <div id="mapOverlay" aria-hidden="true" data-game-menu="closed">
      <section id="mapPanel" role="dialog" aria-modal="true" aria-label="地圖">
        <header class="map-menu-header">
          <h2>地圖</h2>
          <button id="mapClose" type="button" aria-label="關閉地圖">
            <kbd>M</kbd><span aria-hidden="true">／</span><kbd>L3</kbd><span>關閉</span>
          </button>
        </header>
        <section class="world-map" aria-label="海風牧歌地圖">
          <picture class="world-map-art" aria-hidden="true">
            <source
              type="image/webp"
              srcset="/assets/map/world-map-480.webp 480w, /assets/map/world-map-960.webp 960w, /assets/map/world-map-1440.webp 1440w"
              sizes="(max-width: 620px) 90vw, 850px"
            />
            <img src="/assets/map/world-map.png" alt="" />
          </picture>
          <button type="button" data-map-destination="mountain" class="world-map-location world-map-location-mountain">
            <span aria-hidden="true"></span><strong>山區</strong>
          </button>
          <button type="button" data-map-destination="oldVillage" class="world-map-location world-map-location-old-village">
            <span aria-hidden="true"></span><strong>城鎮</strong>
          </button>
          <button type="button" data-map-destination="livingArea" class="world-map-location world-map-location-living-area">
            <span aria-hidden="true"></span><strong>牧場</strong>
          </button>
          <button type="button" data-map-destination="port" class="world-map-location world-map-location-port">
            <span aria-hidden="true"></span><strong>港口</strong>
          </button>
        </section>
      </section>
    </div>
    <div id="inventoryOverlay" aria-hidden="true" data-game-menu="closed">
      <section
        id="inventoryPanel"
        role="dialog"
        aria-modal="true"
        aria-label="資訊選單"
      >
        <header class="inventory-header">
          <span class="inventory-menu-label">資訊</span>
          <div id="inventoryTabs" role="tablist" aria-label="資訊選單分頁">
            <button
              class="inventory-tab active"
              type="button"
              role="tab"
              aria-selected="true"
              data-inventory-tab="bag"
            >
              物品
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="storage"
              tabindex="-1"
            >
              倉庫
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="tools"
              tabindex="-1"
            >
              工具
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="animals"
              tabindex="-1"
            >
              動物
            </button>
            <button
              class="inventory-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-inventory-tab="villagers"
              tabindex="-1"
            >
              村民
            </button>
          </div>
          <button id="inventoryClose" type="button" aria-label="關閉資訊選單">
            Q / Y　關閉
          </button>
        </header>
        <div id="inventoryGrid"></div>
        <footer class="inventory-footer">
          <p id="inventoryDescription">選擇項目以查看說明。</p>
          <p class="inventory-footer-controls">方向鍵選擇　・　LT RT 翻小分頁　・　LB RB 切換大分頁　・　Q／Y 關閉</p>
        </footer>
      </section>
    </div>
    <div
      id="pauseMenu"
      aria-hidden="true"
      data-game-menu="closed"
      data-step="menu"
    >
      <section
        id="pauseMenuPanel"
        class="pauseStep"
        role="dialog"
        aria-modal="true"
        aria-label="暫停選單"
      >
        <nav id="pauseMenuButtons">
          <button type="button" id="pauseResumeBtn" class="titleMenuBtn">
            返回畫面
          </button>
          <button type="button" id="pauseSaveBtn" class="titleMenuBtn">
            儲存進度
          </button>
          <button type="button" id="pauseLoadBtn" class="titleMenuBtn">
            讀取進度
          </button>
          <button type="button" id="pauseTutorialBtn" class="titleMenuBtn">
            玩法教學
          </button>
          <button type="button" id="pauseSystemBtn" class="titleMenuBtn">
            系統
          </button>
          <button type="button" id="pauseTitleBtn" class="titleMenuBtn">
            回到主畫面
          </button>
          <button type="button" id="pauseQuitBtn" class="titleMenuBtn">
            結束遊戲
          </button>
        </nav>
        <p id="pauseQuitMessage" hidden>
          感謝遊玩《海風牧歌》，可以安全關閉這個分頁了。
        </p>
      </section>
      <section id="pauseSaveSlotsPanel" class="pauseStep">
        <h2 id="pauseSaveSlotsHeading">儲存進度</h2>
        <div id="pauseSaveSlotsList"></div>
        <button type="button" id="pauseSaveSlotsBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseLoadSlotsPanel" class="pauseStep">
        <h2 id="pauseLoadSlotsHeading">讀取進度</h2>
        <div id="pauseLoadSlotsList"></div>
        <button type="button" id="pauseLoadSlotsBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseSystemPanel" class="pauseStep">
        <h2 id="pauseSystemHeading">系統</h2>
        <div id="pauseSystemSettings" class="systemSettings"></div>
        <button type="button" id="pauseSystemBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseTutorialPanel" class="pauseStep pauseTutorialStep">
        <h2>玩法教學</h2>
        <p class="pauseTutorialLead">選擇想查看的項目</p>
        <div class="pauseTutorialList">
          <button
            type="button"
            class="pauseTutorialTopic"
            data-tutorial-topic="walking"
          >
            <span class="pauseTutorialTopicNumber">01</span>
            <span
              ><strong>第一章　基本操作</strong
              ><small>移動、互動、選單與手把</small></span
            >
            <span aria-hidden="true">›</span>
          </button>
        </div>
        <button type="button" id="pauseTutorialBackBtn" class="titleMenuBtn">
          返回
        </button>
      </section>
      <section id="pauseTutorialCardsPanel" class="pauseStep pauseTutorialStep">
        <header class="pauseTutorialCardsHeader">
          <button
            type="button"
            id="pauseTutorialCardsBackBtn"
            class="pauseTutorialIconBtn"
            aria-label="返回教學清單"
          >
            ‹
          </button>
          <div>
            <span class="pauseTutorialEyebrow">玩法教學</span>
            <h2>行走</h2>
          </div>
          <span id="pauseTutorialPageNumber" class="pauseTutorialPageNumber"
            >1 / 3</span
          >
        </header>
        <div
          id="pauseTutorialCarousel"
          class="pauseTutorialCarousel"
          tabindex="0"
        >
          <button
            type="button"
            id="pauseTutorialPrevBtn"
            class="pauseTutorialArrow"
            aria-label="上一頁"
          >
            ‹
          </button>
          <article class="pauseTutorialCard" aria-live="polite">
            <div class="pauseTutorialShot">
              <img id="pauseTutorialImage" alt="" />
              <div
                id="pauseTutorialImageFallback"
                class="pauseTutorialImageFallback"
              >
                遊戲截圖預留位置
              </div>
            </div>
            <div class="pauseTutorialCopy">
              <span id="pauseTutorialCardKicker"></span>
              <h3 id="pauseTutorialCardTitle"></h3>
              <p id="pauseTutorialCardText"></p>
              <div id="pauseTutorialKeys" class="pauseTutorialKeys"></div>
            </div>
          </article>
          <button
            type="button"
            id="pauseTutorialNextBtn"
            class="pauseTutorialArrow"
            aria-label="下一頁"
          >
            ›
          </button>
        </div>
        <div id="pauseTutorialDots" class="pauseTutorialDots"></div>
        <p class="pauseTutorialHint">滾輪／← → 切換頁面</p>
      </section>
    </div>
    <div id="fade"></div>
    <div id="cgOverlay"><img id="cgImg" alt="" /></div>
    <div id="dialog">
      <div id="dialogName"></div>
      <img id="dialogPortrait" alt="" />
      <div id="dialogPortraitPlaceholder"></div>
      <div id="dialogText"></div>
      <div id="dialogContinue">按 E 繼續 ▾</div>
    </div>
    <!-- 選項面板獨立在 #dialog 外面(不是內部子元素)：#dialog 有 transform，
         會讓內部 position:fixed 子元素的定位基準變成 #dialog 的 box 而不是
         viewport，搬出來才能單純用 JS 算「貼在對話框正上方」的絕對位置
         (見 dialogue.ts 的 positionChoicePanel)。 -->
    <div id="dialogChoices"></div>
    <div id="fishHint"></div>
    <!-- 釣魚 QTE 浮動提示：跟在主角頭頂正上方，每幀由 game-loop.ts 用
         .project(camera) 算螢幕座標更新 left/top(見 style.css #fishActionHud
         註解)。只在 biting/reeling(要馬上按鍵)這兩個狀態顯示，取代原本
         #fishHint 的整句文字提示。 -->
    <div id="fishActionHud">
      <div id="fishActionKey"></div>
    </div>
    <div id="harvestToast">
      <div id="harvestToastIcon">
        <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <defs>
            <radialGradient id="harvestPearlGrad" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fffaf0" />
              <stop offset="55%" stop-color="#f5d98a" />
              <stop offset="100%" stop-color="#c9a355" />
            </radialGradient>
            <linearGradient id="harvestShellGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4ead9" />
              <stop offset="100%" stop-color="#c7ac82" />
            </linearGradient>
          </defs>
          <path
            d="M24 41 C7 41 3 26 5.5 17 C10.5 19.5 16.5 22 24 22 C31.5 22 37.5 19.5 42.5 17 C45 26 41 41 24 41 Z"
            fill="url(#harvestShellGrad)"
            stroke="#8a7452"
            stroke-width="1.2"
          />
          <path
            d="M24 22 C20 22.5 16 22 11.5 20 M24 22 C28 22.5 32 22 36.5 20 M24 22 C22.5 27 22 33 22.5 38 M24 22 C25.5 27 26 33 25.5 38"
            fill="none"
            stroke="#8a7452"
            stroke-width="1"
            opacity="0.55"
          />
          <circle
            cx="24"
            cy="15"
            r="7.5"
            fill="url(#harvestPearlGrad)"
            stroke="#e8c877"
            stroke-width="1"
          />
        </svg>
      </div>
      <div id="harvestToastBody">
        <div id="harvestToastTitle"></div>
        <div id="harvestToastText"></div>
      </div>
    </div>
    <!-- 開局標題畫面：先「按任意鍵」拿到一次真正的使用者手勢(順便解決
         BGM 自動播放政策擋掉的問題，見 music.ts/title-screen.ts 的說明)，
         再進主選單。純白底、不吃任何圖片素材，z-index 特意開最高(100)，
         蓋過 #fade(20)/#dialog(15) 等既有疊層。 -->
    <div id="titleScreen" data-step="splash">
      <header class="titleLogoGroup">
        <h1 id="titleLogo">海風牧歌</h1>
        <p id="titleSubtitle" style="display: none">Meadowtide</p>
      </header>
      <main id="titleContent">
        <div id="titleSplash" class="titleStep">
          <p id="titlePrompt">按任意鍵開始</p>
        </div>
        <div id="titleMenu" class="titleStep">
          <nav id="titleMenuButtons">
            <button type="button" id="titleNewGameBtn" class="titleMenuBtn">
              開始新遊戲
            </button>
            <button
              type="button"
              id="titleContinueBtn"
              class="titleMenuBtn"
              hidden
            >
              繼續遊戲
            </button>
            <button type="button" id="titleSystemBtn" class="titleMenuBtn">
              系統
            </button>
            <button type="button" id="titleQuitBtn" class="titleMenuBtn">
              結束遊戲
            </button>
          </nav>
          <p id="titleQuitMessage" hidden>
            感謝遊玩《海風牧歌》，可以安全關閉這個分頁了。
          </p>
        </div>
        <div id="titleProfileName" class="titleStep titleProfileStep">
          <p class="titleProfilePrompt">
            您就是新的牧場主是吧，那麼請您在這裡簽下名字
          </p>
          <label for="titlePlayerNameInput">牧場主姓名</label>
          <input
            id="titlePlayerNameInput"
            type="text"
            maxlength="16"
            autocomplete="off"
            aria-describedby="titlePlayerNameHint"
          />
          <small id="titlePlayerNameHint">最多 16 個字元</small>
          <div class="titleProfileActions">
            <button type="button" id="titleNameBackBtn" class="titleMenuBtn">
              返回
            </button>
            <button
              type="button"
              id="titleNameConfirmBtn"
              class="titleMenuBtn"
              disabled
            >
              簽名
            </button>
          </div>
        </div>
        <div id="titleAppearance" class="titleStep titleProfileStep">
          <h2>請選擇外型</h2>
          <div
            class="titleAppearanceChoices"
            role="radiogroup"
            aria-label="玩家外型"
          >
            <button
              type="button"
              id="titleMaleAppearanceBtn"
              class="titleAppearanceCard"
              role="radio"
              aria-checked="false"
            >
              <img id="titleMaleAppearancePreview" alt="男性牧場主外型" />
            </button>
            <button
              type="button"
              id="titleFemaleAppearanceBtn"
              class="titleAppearanceCard"
              role="radio"
              aria-checked="false"
            >
              <img id="titleFemaleAppearancePreview" alt="女性牧場主外型" />
            </button>
          </div>
          <button
            type="button"
            id="titleAppearanceBackBtn"
            class="titleMenuBtn"
          >
            返回
          </button>
        </div>
        <div id="titleSystem" class="titleStep">
          <h2 id="titleSystemHeading">系統</h2>
          <div id="titleSystemSettings" class="systemSettings"></div>
          <button type="button" id="titleSystemBackBtn" class="titleMenuBtn">
            返回
          </button>
        </div>
        <div id="titleLoadSlots" class="titleStep">
          <h2 id="titleLoadSlotsHeading">選擇存檔</h2>
          <div id="titleLoadSlotsList"></div>
          <button type="button" id="titleLoadSlotsBackBtn" class="titleMenuBtn">
            返回
          </button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
