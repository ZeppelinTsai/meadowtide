<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>角色模型預覽 — 海風牧歌</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2430; }
      #ui {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        font-family: sans-serif; color: #eee; background: rgba(20,26,34,0.75);
        padding: 10px 14px; border-radius: 8px; font-size: 14px;
      }
      #ui select { font-size: 14px; margin-left: 6px; }
      #ui p { margin: 6px 0 0; opacity: 0.7; font-size: 12px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="ui">
      角色：
      <select id="characterSelect">
        <option value="marineBiologist" selected>海洋生物學家(新)</option>
        <option value="mayor">村長</option>
        <option value="carpenter">木匠</option>
        <option value="captain">船長</option>
        <option value="artist">藝術家</option>
        <option value="botanist">植物學家(新)</option>
        <option value="humanoid">通用 NPC</option>
      </select>
      <p>滑鼠拖曳旋轉／滾輪縮放，這頁不吃遊戲存檔、不影響正式遊戲。</p>
    </div>
    <script type="module" src="/src/debug-character.ts"></script>
  </body>
</html>
